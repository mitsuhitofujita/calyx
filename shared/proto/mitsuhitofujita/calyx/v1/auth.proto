syntax = "proto3";

package mitsuhitofujita.calyx.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/mitsuhitofujita/calyx/shared/proto/mitsuhitofujita/calyx/v1;calyxv1";

// AuthService exchanges a Google-issued credential for a Calyx session token.
service AuthService {
  // Login verifies a Google credential and returns a short-lived session JWT.
  //
  // Status codes:
  //   OK               - session minted; see LoginResponse.
  //   INVALID_ARGUMENT - no credential provided, or an empty id_token.
  //   UNIMPLEMENTED    - auth_code variant (not implemented this phase).
  //   UNAUTHENTICATED  - Google id_token verification failed.
  //   INTERNAL         - failed to sign the session token.
  rpc Login(LoginRequest) returns (LoginResponse);

  // Status verifies the session token presented in the request metadata
  // ("authorization: Bearer <session_token>") and reports whether the session
  // is valid, along with its details when it is.
  //
  // Auth outcomes are reported in the response body (authenticated = false with
  // the reason in `message`), NOT as a gRPC error: Status returns OK even for a
  // missing, invalid, or expired token. A gRPC error indicates only a genuine
  // server fault.
  rpc Status(StatusRequest) returns (StatusResponse);
}

message LoginRequest {
  // The Google-issued credential obtained by the CLI during browser sign-in.
  // Exactly one variant is expected.
  oneof google_credential {
    // Google OIDC ID token (JWT). Implemented in this phase.
    string id_token = 1;
    // Google OAuth authorization code. Reserved; returns UNIMPLEMENTED for now.
    string auth_code = 2;
  }
}

message LoginResponse {
  // The Calyx-issued session token (JWT) to be sent on subsequent requests.
  string session_token = 1;
  // When the session token expires.
  google.protobuf.Timestamp expires_at = 2;
}

// StatusRequest is intentionally empty: the session token is read from the
// "authorization: Bearer <session_token>" gRPC metadata header.
message StatusRequest {}

message StatusResponse {
  // Whether a valid (signed, unexpired, correctly-scoped) session token was
  // presented in the request metadata.
  bool authenticated = 1;
  // Human-readable detail. On success, a brief confirmation; on failure, the
  // reason (e.g. no token provided, or the session is invalid/expired).
  string message = 2;
  // Populated only when authenticated == true.
  SessionInfo session = 3;
}

// SessionInfo carries the verified session's basic details.
message SessionInfo {
  // User's display name (from the JWT "name" claim).
  string name = 1;
  // User's email (from the JWT "email" claim); supplementary.
  string email = 2;
  // Role from the JWT "role" claim (currently the fixed placeholder "admin").
  string role = 3;
  // Permissions/authorizations from the JWT "permissions" claim
  // (currently the fixed placeholder ["*"]).
  repeated string permissions = 4;
  // When the session expires (mirrors the JWT "exp" claim).
  google.protobuf.Timestamp expires_at = 5;
}
